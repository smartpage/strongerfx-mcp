<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Impact;src:local("Impact")}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;background:#141b25;font-family:Impact,"Arial Black",sans-serif;color:#fff;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 55% at 50% 52%,#4a3b9a 0%,#241d4a 45%,#141b25 100%)}
.scrimTop{position:absolute;left:0;right:0;top:0;height:420px;background:linear-gradient(#000 0%,rgba(0,0,0,.85) 40%,rgba(0,0,0,0) 100%)}
.scrimBot{position:absolute;left:0;right:0;bottom:0;height:620px;background:linear-gradient(rgba(0,0,0,0) 0%,rgba(0,0,0,.88) 40%,#000 100%)}
.eyebrow{position:absolute;top:96px;left:80px;right:80px;font-family:"DIN Condensed",Impact,sans-serif;font-size:30px;letter-spacing:6px;color:#b7a4ff;text-align:center}
.hook{position:absolute;top:140px;left:80px;right:80px;text-align:center;font-size:104px;line-height:.96;letter-spacing:1px;text-transform:uppercase;text-shadow:0 6px 24px rgba(0,0,0,.6)}
.face{position:absolute;left:50%;top:330px;width:600px;transform:translateX(-50%);filter:drop-shadow(0 30px 50px rgba(0,0,0,.6))}
.play{position:absolute;left:50%;top:715px;transform:translateX(-50%);width:130px;height:130px;border-radius:50%;background:#fff;box-shadow:0 0 0 18px rgba(255,255,255,.14),0 0 0 36px rgba(255,255,255,.06),0 18px 40px rgba(0,0,0,.5)}
.play:after{content:"";position:absolute;left:50px;top:35px;border-left:48px solid #141b25;border-top:30px solid transparent;border-bottom:30px solid transparent}
.name{position:absolute;top:868px;left:80px;right:80px;text-align:center;font-size:140px;line-height:1;letter-spacing:4px}
.line{position:absolute;top:1012px;left:80px;right:80px;height:110px}
.line img{position:absolute;left:0;top:0;width:920px;height:100px;opacity:.95}
.prog{position:absolute;left:0;right:0;top:47px;height:6px;background:rgba(255,255,255,.28);border-radius:3px}
.prog i{position:absolute;left:0;top:0;height:6px;width:38%;background:#b7a4ff;border-radius:3px}
.prog b{position:absolute;left:38%;top:-9px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:#fff}
.time{position:absolute;top:104px;left:0;right:0;display:flex;justify-content:space-between;font-family:"DIN Condensed",sans-serif;font-size:28px;letter-spacing:2px;color:#c9c9d6}
.cta{position:absolute;bottom:122px;left:80px;right:80px;text-align:center;font-size:50px;letter-spacing:2px;text-transform:uppercase}
.cta span{display:inline-block;background:#b7a4ff;color:#141b25;padding:10px 30px 6px;border-radius:12px}
.url{position:absolute;bottom:126px;left:80px;right:80px;text-align:center;font-family:"DIN Condensed",sans-serif;font-size:26px;letter-spacing:4px;color:#8e9aa9;display:none}
.guide{position:absolute;left:80px;right:80px;top:80px;bottom:120px;border:3px dashed rgba(255,80,80,.9);display:GUIDES}
</style></head><body>
<div class="bg"></div>
<img class="face" src="faah-cut.png">
<div class="scrimTop"></div><div class="scrimBot"></div>
<div class="eyebrow">MEMEFX / 001</div>
<div class="hook">You know<br>this one.</div>
<div class="play"></div>
<div class="name">FAAH</div>
<div class="line"><img src="wave.png"><div class="prog"><i></i><b></b></div><div class="time"><span>0:00</span><span>0:01</span></div></div>
<div class="cta"><span>Comment SOUNDS to get it</span></div>
<div class="guide"></div>
</body></html>
